version: "3.9"

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    networks:
      - vitae_net
    # No port exposed publicly. Accessed only from the app container.
    # Uncomment if you want host access:
    # ports:
    #   - "127.0.0.1:27017:27017"

  app:
    build: .
    image: vitae-publica:latest
    restart: unless-stopped
    depends_on:
      - mongo
    environment:
      - NODE_ENV=production
      - PORT=8006
      - MONGO_URL=mongodb://mongo:27017
      - DB_NAME=vitae_publica
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-changeme-strong-password}
      - NEXT_PUBLIC_BASE_URL=${NEXT_PUBLIC_BASE_URL:-https://portail.vitae-publica.tech}
      - CORS_ORIGINS=*
      - UPLOAD_DIR=/app/data/uploads
    volumes:
      - uploads_data:/app/data
    ports:
      - "127.0.0.1:8006:8006"   # only exposed on localhost, Caddy/Nginx will reverse-proxy
    networks:
      - vitae_net

volumes:
  mongo_data:
  uploads_data:

networks:
  vitae_net:
    driver: bridge

version: "3.9"

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    networks:
      - vitea_net
    # No port exposed publicly. Accessed only from the app container.
    # Uncomment if you want host access:
    # ports:
    #   - "127.0.0.1:27017:27017"

  app:
    build: .
    image: vitea-publica:latest
    restart: unless-stopped
    depends_on:
      - mongo
    environment:
      - NODE_ENV=production
      - PORT=8006
      - MONGO_URL=mongodb://mongo:27017
      - DB_NAME=vitea_publica
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-changeme-strong-password}
      - NEXT_PUBLIC_BASE_URL=https://portail.vitea-publica.tech
      - CORS_ORIGINS=*
    ports:
      - "127.0.0.1:8006:8006"   # only exposed on localhost, Caddy/Nginx will reverse-proxy
    networks:
      - vitea_net

volumes:
  mongo_data:

networks:
  vitea_net:
    driver: bridge
